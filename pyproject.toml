[project]
name = "clipit"
version = "0.1.0"
description = "Local AI gaming video clipping tool for YouTube Shorts, Reels, and TikTok"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "pysubs2>=1.7.0",
    "jinja2>=3.1.0",
    "opencv-python-headless>=4.9.0",
    "pillow>=10.0.0",
    "edge-tts>=7.0.0",
    "scenedetect>=0.6.0",
    "mlx-whisper>=0.4.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "faster-whisper>=1.0.0; sys_platform != 'darwin' or platform_machine != 'arm64'",
]

[project.optional-dependencies]
llm = [
    "anthropic>=0.30.0",
    "google-genai>=0.1.0",
]

[project.scripts]
clipit = "clipit.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
